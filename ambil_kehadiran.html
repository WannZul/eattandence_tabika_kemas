<html>

            width: 500px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 10px #ccc;
        }

        h2{
            color: #3f51d9;
        }

        }

            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background: #2f3bb5;
        }

        a{
            text-decoration: none;
        }

    </style>

</head>

</body>
</html>
