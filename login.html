<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#eef1ff;
            font-family:'Segoe UI',sans-serif;
        }

        .main-container{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{

            width:380px;
            background:#fff;
            border-radius:40px;
            padding:70px 35px 40px;
            position:relative;
            box-shadow:0 10px 25px rgba(0,0,0,.08);

        }

        .user-icon{

            width:70px;
            height:70px;
            background:#3f51b5;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            position:absolute;
            top:-35px;
            left:50%;
            transform:translateX(-50%);
            color:white;
            font-size:32px;

        }

        h1{

            text-align:center;
            font-weight:bold;
            margin-bottom:40px;

        }

        .input-group-text{

            background:#ececec;
            border:none;

        }

        .form-control{

            background:#ececec;
            border:none;

        }

        .form-control:focus{

            box-shadow:none;
            background:#ececec;

        }

        .forgot{

            font-size:14px;
            text-align:right;
            margin-top:8px;

        }

        .forgot a{

            color:gray;

        }

        .btn-login{

            background:#171b20;
            color:white;
            border-radius:30px;
            font-weight:600;

        }

        .btn-login:hover{

            background:#000;
            color:white;

        }

        .btn-signup{

            background:#ececec;
            border-radius:30px;

        }

        .divider{

            display:flex;
            align-items:center;
            margin:15px 0;

        }

        .divider hr{

            flex:1;

        }

        .divider span{

            margin:0 10px;
            color:gray;

        }

    </style>

</head>

<body>

<div class="container main-container">

<div class="login-card">

<div class="user-icon">
<i class="bi bi-person-fill"></i>
</div>

<h1>Login</h1>

<form action="login_process.php" method="POST">

<div class="input-group mb-3">

<span class="input-group-text">
<i class="bi bi-person-fill"></i>
</span>

<input
type="text"
name="username"
class="form-control"
placeholder="Username"
required>

</div>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock-fill"></i>
</span>

<input
type="password"
name="password"
id="password"
class="form-control"
placeholder="Password"
required>

<button
class="input-group-text"
type="button"
onclick="showPassword()">

<i id="eye" class="bi bi-eye-slash-fill"></i>

</button>

</div>

<div class="forgot">
<a href="#">Forgot Password?</a>
</div>

<div class="d-grid mt-4">

<button class="btn btn-login">
Log In
</button>

</div>

<div class="divider">

<hr>

<span>Or</span>

<hr>

</div>

<div class="d-grid">

<a href="register.php" class="btn btn-signup">
Sign Up
</a>

</div>

</form>

</div>

</div>

<script>

function showPassword(){

var password=document.getElementById("password");
var eye=document.getElementById("eye");

if(password.type==="password"){

password.type="text";
eye.className="bi bi-eye-fill";

}else{

password.type="password";
eye.className="bi bi-eye-slash-fill";

}

}

</script>

</body>
</html>
